<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper or Scissors</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = gameTitleAndInfoContainer>
        <h1>Game of Rock, Paper, Scissors</h1>
        <h2>Your objective is to win against the computer</h2>

        <div class = "optionsToChooseContainer">
            <h3>Select either rock, paper, or scissors</h3>
        </div>
    </div>

    <div class = "playerChoicesContainer">
        <button class = "rockBtn">
            <img src="images/Rock.png">
        </button>

        <button class = "paperBtn">
            <img src="images/Paper.png">
        </button>

        <button class = "scissorsBtn">
            <img src="images/Scissors.png">
        </button>
    </div>

    <h2 class = "scoreboard"></h2>
    <h2 class = "displayCPUChoice"></h2>
    <h2 class = "displayResult"></h2>

    <div class = "centerBtnContainer">
        <button class = "restartBtn">Restart</button>
    </div>

    <script src ="RockPaperScissors.js"></script>
</body>
</html>
